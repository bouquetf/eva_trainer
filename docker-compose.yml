# Eva Trainer - Docker Compose
# Démarrage : docker compose up -d
# Arrêt : docker compose down

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-eva_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eva_pass}
      POSTGRES_DB: ${DB_NAME:-eva_trainer}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eva_user} -d ${DB_NAME:-eva_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eva-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-eva_user}:${DB_PASSWORD:-eva_pass}@db:5432/${DB_NAME:-eva_trainer}?sslmode=disable
      - GIN_MODE=debug
      - PORT=${PORT:-8080}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eva-network

volumes:
  pgdata:

networks:
  eva-network:
    driver: bridge
