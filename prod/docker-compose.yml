# Eva Trainer - Production Docker Compose
# Usage: cd prod && docker compose up -d
#        cd prod && docker compose down
#
# Configuration (.env file in this directory):
#   VITE_API_URL=http://localhost:8080
#   HOST_PORT=8080
#   DB_USER=eva_user
#   DB_PASSWORD=<strong-password>
#   DB_NAME=eva_trainer
#   JWT_SECRET=<your-jwt-secret-min-32-chars>
#   DISCORD_CLIENT_ID=<discord-app-client-id>
#   DISCORD_CLIENT_SECRET=<discord-app-client-secret>
#   DISCORD_REDIRECT_URL=http://localhost:8080/api/v1/auth/discord/callback
#   SERVER_FRONTEND_URL=http://localhost:8080
#   CORS_ORIGINS=http://localhost:8080
#   GIN_MODE=release
#   LOG_LEVEL=info

services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER:-eva_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-eva_trainer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eva_user} -d ${DB_NAME:-eva_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eva-network
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-eva_user}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-eva_trainer}?sslmode=disable
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-168h}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      - DISCORD_REDIRECT_URL=${DISCORD_REDIRECT_URL:-http://localhost:8080/api/v1/auth/discord/callback}
      - SERVER_FRONTEND_URL=${SERVER_FRONTEND_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-auto}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./dump:/app/dump:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eva-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  eva-network:
    driver: bridge
